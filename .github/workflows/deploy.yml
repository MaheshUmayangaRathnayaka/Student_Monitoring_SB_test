name: Deploy Student Performance System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Client Image (NO CACHE to ensure new frontend changes)
      - name: Build Client Docker Image
        run: |
          docker build --no-cache \
          -t maheshur/student-performance-client:latest \
          ./client

      # 4. Build Server Image
      - name: Build Server Docker Image
        run: |
          docker build --no-cache \
          -t maheshur/student-performance-server:latest \
          ./server

      # 5. Push Client Image
      - name: Push Client Image
        run: docker push maheshur/student-performance-client:latest

      # 6. Push Server Image
      - name: Push Server Image
        run: docker push maheshur/student-performance-server:latest

      # 7. Deploy on EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 43.205.210.137
          username: ubuntu
          key: ${{ secrets.EC2_PEM }}
          script: |
            cd ~/Student_Monitoring_SB_test

            echo "Setting up environment variables..."
            export MONGODB_URI="${{ secrets.MONGODB_URI }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"

            echo "Stopping old containers..."
            docker compose down

            echo "Removing old containers and images..."
            docker container prune -f
            docker image prune -af

            echo "Pulling latest images with force..."
            docker compose pull

            echo "Removing any cached images..."
            docker rmi $(docker images -q maheshur/student-performance-client:latest) 2>/dev/null || true
            docker rmi $(docker images -q maheshur/student-performance-server:latest) 2>/dev/null || true

            echo "Pulling fresh images..."
            docker compose pull

            echo "Starting containers with fresh images..."
            MONGODB_URI="${{ secrets.MONGODB_URI }}" JWT_SECRET="${{ secrets.JWT_SECRET }}" docker compose up -d

            echo "Waiting for containers to start..."
            sleep 10

            echo "Checking container status..."
            docker compose ps

            echo "Checking container logs..."
            docker compose logs --tail=20

            echo "Deployment completed successfully!"
