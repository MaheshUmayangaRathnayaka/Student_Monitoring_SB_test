name: Deploy Student Performance System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Client Image (NO CACHE to ensure new frontend changes)
      - name: Build Client Docker Image
        run: |
          docker build --no-cache \
          -t maheshur/student-performance-client:latest \
          ./client

      # 4. Build Server Image
      - name: Build Server Docker Image
        run: |
          docker build --no-cache \
          -t maheshur/student-performance-server:latest \
          ./server

      # 5. Push Client Image
      - name: Push Client Image
        run: docker push maheshur/student-performance-client:latest

      # 6. Push Server Image
      - name: Push Server Image
        run: docker push maheshur/student-performance-server:latest

      # 7. Deploy on EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 43.205.210.137
          username: ubuntu
          key: ${{ secrets.EC2_PEM }}
          script: |
            cd ~/Student_Monitoring_SB_test

            echo "Stopping old containers..."
            docker-compose down

            echo "Removing unused images..."
            docker image prune -af

            echo "Pulling latest images..."
            docker-compose pull

            echo "Starting containers..."
            docker-compose up -d

            echo "Deployment completed successfully!"
